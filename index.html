<link rel="stylesheet" href="styles.css">
<script>
(function () {
  var key = "von-fett-nach-duenn.v1";
  var theme = "system";
  var look = "gross";
  try {
    var raw = localStorage.getItem(key);
    if (raw) {
      var data = JSON.parse(raw);
      var s = data && data.settings;
      if (s) {
        if (s.theme === "light" || s.theme === "dark" || s.theme === "system") theme = s.theme;
        if (s.look === "lila" || s.look === "gross") look = s.look;
        else if (s.senior === false || (typeof s.senior !== "boolean" && data.version === 1)) look = "lila";
      }
    }
  } catch (e) {}
  var dark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  var root = document.documentElement;
  root.setAttribute("data-theme", dark ? "dark" : "light");
  root.setAttribute("data-theme-pref", theme);
  root.removeAttribute("data-mode");
  if (look === "lila") root.setAttribute("data-look", "lila");
  else root.removeAttribute("data-look");
  root.style.colorScheme = dark ? "dark" : "light";
  var themeMeta = document.querySelector('meta[name="theme-color"]');
  if (themeMeta) {
    var color = getComputedStyle(root).getPropertyValue("--bg").trim();
    if (color) themeMeta.setAttribute("content", color);
  }
})();
</script>
</head>
